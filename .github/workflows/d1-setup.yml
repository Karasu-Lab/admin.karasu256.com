name: D1 Setup (temporary)

on:
  workflow_dispatch:

jobs:
  create:
    environment: preview
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create the admin D1 database if missing and apply migrations
        run: |
          npx -y wrangler@4 d1 create admin || true
          npx -y wrangler@4 d1 list
          npx -y wrangler@4 d1 migrations apply admin --remote --config wrangler.jsonc || true
          npx -y wrangler@4 d1 info admin
